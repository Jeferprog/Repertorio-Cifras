<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Repertório de Cifras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --bg:        #FAF7F2;
      --surface:   #F2EDE4;
      --surface2:  #E8E1D6;
      --border:    #D4C9BA;
      --accent:    #C8843A;
      --accent-lo: rgba(200,132,58,.12);
      --text:      #1E1410;
      --text-mid:  #5C4E43;
      --text-dim:  #9C8878;
      --radius:    12px;
      --shadow:    0 1px 4px rgba(30,20,10,.08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#141008;--surface:#1C160E;--surface2:#261E14;--border:#3A2E22;
        --accent:#D4924A;--accent-lo:rgba(212,146,74,.14);--text:#F0E8DC;
        --text-mid:#C0AC98;--text-dim:#7A6858;--shadow:0 1px 4px rgba(0,0,0,.3);
      }
    }
    :root[data-theme="dark"] {
      --bg:#141008;--surface:#1C160E;--surface2:#261E14;--border:#3A2E22;
      --accent:#D4924A;--accent-lo:rgba(212,146,74,.14);--text:#F0E8DC;
      --text-mid:#C0AC98;--text-dim:#7A6858;--shadow:0 1px 4px rgba(0,0,0,.3);
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-text-size-adjust:100%;}
    body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh;font-size:15px;line-height:1.5;}

    /* Header */
    .header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;padding:0 1rem;height:56px;display:flex;align-items:center;gap:.75rem;box-shadow:var(--shadow);}
    .back-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:1.2rem;cursor:pointer;flex-shrink:0;transition:background .1s;-webkit-tap-highlight-color:transparent;}
    .back-btn.show{display:flex;}
    .back-btn:active{background:var(--accent-lo);}
    .header-info{flex:1;min-width:0;}
    .header-title{font-family:'Lora',Georgia,serif;font-weight:600;font-size:1rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .header-sub{font-size:.72rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
    .header-actions{display:flex;align-items:center;gap:.5rem;flex-shrink:0;}
    .icon-btn{width:36px;height:36px;background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-dim);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;-webkit-tap-highlight-color:transparent;position:relative;}
    .icon-btn:active{background:var(--accent-lo);}
    .badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-content:center;padding:0 3px;}
    .badge.show{display:flex;}

    /* Main */
    .main{max-width:520px;margin:0 auto;padding:1.25rem 1rem 3rem;}

    /* Label */
    .label{font-size:.68rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--text-dim);margin-bottom:.6rem;}

    /* Category grid */
    .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:.625rem;}
    .cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1rem 1rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;-webkit-tap-highlight-color:transparent;user-select:none;}
    .cat-card:hover{border-color:var(--accent);}
    .cat-card:active{background:var(--accent-lo);border-color:var(--accent);}
    .cat-icon{font-size:1.875rem;line-height:1;margin-bottom:.5rem;display:block;}
    .cat-name{font-size:.82rem;font-weight:600;color:var(--text);line-height:1.3;}

    /* Lists */
    .item-list{display:flex;flex-direction:column;gap:.4rem;}
    .list-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.875rem 1rem;display:flex;align-items:center;gap:.75rem;cursor:pointer;color:inherit;transition:border-color .15s,background .1s;-webkit-tap-highlight-color:transparent;user-select:none;}
    .list-item:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--border));}
    .list-item:active{background:var(--accent-lo);border-color:var(--accent);}
    .item-icon{font-size:1.25rem;flex-shrink:0;width:1.75rem;text-align:center;}
    .item-body{flex:1;min-width:0;}
    .item-name{font-size:.88rem;font-weight:500;color:var(--text);}
    .item-meta{font-size:.73rem;color:var(--text-dim);margin-top:.125rem;}
    .item-chevron{color:var(--text-dim);flex-shrink:0;font-size:1rem;line-height:1;}
    .song-item .item-name{font-weight:400;}
    .song-item .item-icon{color:var(--accent);font-size:1rem;}

    /* Add-to-setlist button */
    .add-btn{width:30px;height:30px;flex-shrink:0;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text-mid);font-size:1.1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s,border-color .1s,color .1s;-webkit-tap-highlight-color:transparent;line-height:1;font-family:inherit;}
    .add-btn:active{background:var(--accent-lo);border-color:var(--accent);}
    .add-btn.in-list{background:var(--accent-lo);border-color:var(--accent);color:var(--accent);}

    /* Search */
    .search-wrap{position:relative;margin-bottom:.875rem;}
    .search-icon{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none;width:15px;height:15px;}
    .search-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:.75rem 1rem .75rem 2.5rem;color:var(--text);font-family:inherit;font-size:.9rem;outline:none;transition:border-color .15s;-webkit-appearance:none;}
    .search-input:focus{border-color:var(--accent);}
    .search-input::placeholder{color:var(--text-dim);}
    .search-clear{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-dim);font-size:1rem;cursor:pointer;padding:.25rem;display:none;line-height:1;}
    .search-clear.show{display:block;}

    /* Sections */
    .section{margin-bottom:1.5rem;}

    /* States */
    .loading-state{display:flex;flex-direction:column;align-items:center;gap:.875rem;padding:4rem 1rem;color:var(--text-dim);font-size:.875rem;}
    .spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .65s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none;border-top-color:var(--accent);}}
    .empty-state{text-align:center;padding:3rem 1rem;color:var(--text-dim);font-size:.875rem;}
    .empty-icon{font-size:2.25rem;margin-bottom:.75rem;}
    .empty-title{font-weight:500;color:var(--text-mid);margin-bottom:.25rem;}
    .no-results{text-align:center;padding:1.5rem 1rem;color:var(--text-dim);font-size:.875rem;display:none;}

    /* Overlay (viewer + setlist panel) */
    .overlay{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
    .overlay.open{transform:translateY(0);}
    @media(prefers-reduced-motion:reduce){.overlay{transition:none;}}

    .overlay-header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1rem;height:52px;display:flex;align-items:center;gap:.75rem;flex-shrink:0;box-shadow:var(--shadow);}
    .overlay-back{background:none;border:1px solid var(--border);border-radius:8px;color:var(--accent);font-family:inherit;font-size:.875rem;font-weight:500;padding:.375rem .75rem;cursor:pointer;flex-shrink:0;transition:background .1s;-webkit-tap-highlight-color:transparent;}
    .overlay-back:active{background:var(--accent-lo);}
    .overlay-title{font-size:.875rem;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
    .overlay-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface2);}

    /* Viewer internals */
    .viewer-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.875rem;color:var(--text-dim);font-size:.875rem;padding:4rem 1rem;text-align:center;}
    .viewer-loading-sub{font-size:.75rem;color:var(--text-dim);opacity:.7;}
    .viewer-canvas{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;}
    .viewer-canvas canvas{display:block;box-shadow:0 2px 12px rgba(0,0,0,.35);border-radius:2px;}

    /* Viewer controls — two rows */
    .viewer-controls{background:var(--surface);border-top:1px solid var(--border);padding:.5rem 1rem;flex-shrink:0;display:flex;flex-direction:column;gap:.5rem;}
    .ctrl-nav-row{display:flex;align-items:center;gap:.5rem;}
    .ctrl-nav-btn{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:.8rem;font-weight:500;padding:.375rem .75rem;cursor:pointer;flex-shrink:0;transition:background .1s,border-color .1s;-webkit-tap-highlight-color:transparent;}
    .ctrl-nav-btn:active{background:var(--accent-lo);border-color:var(--accent);}
    .ctrl-nav-btn:disabled{opacity:.35;cursor:default;}
    .ctrl-nav-info{flex:1;text-align:center;font-size:.75rem;color:var(--text-dim);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ctrl-scroll-row{display:flex;align-items:center;gap:.75rem;}
    .ctrl-play{background:var(--accent);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:.875rem;font-weight:600;padding:.5rem 1.125rem;cursor:pointer;flex-shrink:0;transition:opacity .1s;min-width:96px;-webkit-tap-highlight-color:transparent;}
    .ctrl-play:active{opacity:.8;}
    .ctrl-speed{display:flex;align-items:center;gap:.5rem;margin-left:auto;}
    .ctrl-speed-label{font-size:.78rem;color:var(--text-mid);min-width:5rem;text-align:center;}
    .ctrl-speed-btn{width:34px;height:34px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:inherit;transition:background .1s;-webkit-tap-highlight-color:transparent;}
    .ctrl-speed-btn:active{background:var(--accent-lo);border-color:var(--accent);}

    /* Setlist panel internals */
    .setlist-body-inner{padding:1rem;display:flex;flex-direction:column;gap:.5rem;min-height:100%;}
    .setlist-empty{text-align:center;padding:3rem 1rem;color:var(--text-dim);font-size:.875rem;}
    .setlist-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem .875rem;display:flex;align-items:center;gap:.625rem;}
    .setlist-num{font-size:.7rem;font-weight:700;color:var(--accent);min-width:1.5rem;text-align:center;flex-shrink:0;}
    .setlist-info{flex:1;min-width:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
    .setlist-info:active .setlist-title{color:var(--accent);}
    .setlist-title{font-size:.875rem;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .setlist-artist{font-size:.73rem;color:var(--text-dim);margin-top:.1rem;}
    .setlist-actions{display:flex;gap:.25rem;flex-shrink:0;}
    .sl-btn{width:28px;height:28px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text-mid);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s;-webkit-tap-highlight-color:transparent;font-family:inherit;}
    .sl-btn:active{background:var(--accent-lo);border-color:var(--accent);}
    .sl-btn:disabled{opacity:.3;cursor:default;}
    .sl-btn.remove{color:#c0392b;}
    .setlist-footer{background:var(--surface);border-top:1px solid var(--border);padding:.75rem 1rem;flex-shrink:0;}
    .setlist-play-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:.9rem;font-weight:600;padding:.75rem 1rem;cursor:pointer;transition:opacity .1s;-webkit-tap-highlight-color:transparent;}
    .setlist-play-btn:active{opacity:.8;}
    .setlist-io-row{display:flex;gap:.5rem;margin-top:.5rem;}
    .setlist-io-btn{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text-mid);font-family:inherit;font-size:.85rem;font-weight:500;padding:.6rem 1rem;cursor:pointer;transition:background .1s,border-color .1s;-webkit-tap-highlight-color:transparent;text-align:center;}
    .setlist-io-btn:active{background:var(--accent-lo);border-color:var(--accent);}

    /* Transpose row */
    .ctrl-transpose-row{display:flex;align-items:center;gap:.5rem;border-top:1px solid var(--border);padding-top:.45rem;}
    .ctrl-transpose-label{font-size:.75rem;color:var(--text-dim);flex-shrink:0;}
    .ctrl-transpose-val{font-size:.82rem;font-weight:600;color:var(--accent);min-width:3.2rem;text-align:center;}

    /* Text (cifra) view */
    .text-view-wrap{width:100%;padding:.75rem .875rem 1.5rem;}
    .tv-page-sep{text-align:center;color:var(--text-dim);font-size:.7rem;margin:.6rem 0;letter-spacing:.15em;}
    .tv-row{font-family:'Courier New',Courier,monospace;white-space:pre;line-height:1.55;overflow-x:visible;}
    .tv-row.chord{font-size:.8rem;color:var(--text-mid);}
    .tv-row.lyric{font-size:.88rem;color:var(--text);}
    .tv-row.empty{height:.4em;}
    .tv-chord{color:var(--accent);font-weight:700;}

    /* Misc */
    .accent-line{height:2px;background:linear-gradient(90deg,var(--accent) 0%,transparent 100%);border:none;margin-bottom:1.25rem;border-radius:1px;opacity:.45;}
    .notice{background:var(--accent-lo);border:1px solid var(--accent);border-radius:8px;padding:.75rem 1rem;font-size:.8rem;color:var(--text-mid);margin-bottom:1rem;}
  </style>
</head>
<body>

<header class="header">
  <button class="back-btn" id="backBtn" aria-label="Voltar">‹</button>
  <div class="header-info">
    <div class="header-title" id="headerTitle">🎸 Repertório de Cifras</div>
    <div class="header-sub"  id="headerSub"></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="setlistBtn" aria-label="Meu Repertório" title="Meu Repertório">
      🎼<span class="badge" id="setlistBadge"></span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema" title="Alternar tema">☀️</button>
  </div>
</header>

<main class="main" id="app">
  <div class="loading-state"><div class="spinner"></div>Carregando…</div>
</main>

<!-- PDF Viewer -->
<div id="viewer" class="overlay" aria-hidden="true">
  <div class="overlay-header">
    <button class="overlay-back" id="viewerBack">‹ Voltar</button>
    <span class="overlay-title" id="viewerTitle"></span>
  </div>
  <div class="overlay-body" id="viewerBody">
    <div class="viewer-loading" id="viewerLoading">
      <div class="spinner"></div>
      Carregando cifra…
      <span class="viewer-loading-sub" id="viewerLoadingPages"></span>
    </div>
    <div id="viewerCanvas" class="viewer-canvas"></div>
  </div>
  <div class="viewer-controls" id="viewerControls" style="display:none">
    <div class="ctrl-nav-row">
      <button class="ctrl-nav-btn" id="prevBtn">← Anterior</button>
      <span class="ctrl-nav-info" id="navInfo"></span>
      <button class="ctrl-nav-btn" id="nextBtn">Próxima →</button>
    </div>
    <div class="ctrl-scroll-row">
      <button class="ctrl-play" id="scrollToggle">▶ Rolar</button>
      <div class="ctrl-speed">
        <button class="ctrl-speed-btn" id="speedDown" aria-label="Diminuir velocidade">−</button>
        <span class="ctrl-speed-label" id="speedLabel">Velocidade 3</span>
        <button class="ctrl-speed-btn" id="speedUp" aria-label="Aumentar velocidade">+</button>
      </div>
    </div>
    <div class="ctrl-transpose-row">
      <span class="ctrl-transpose-label">Tom</span>
      <button class="ctrl-speed-btn" id="transposeDown" title="Meio tom abaixo">♭</button>
      <span class="ctrl-transpose-val" id="transposeLabel">0</span>
      <button class="ctrl-speed-btn" id="transposeUp" title="Meio tom acima">♯</button>
      <button class="ctrl-nav-btn" id="transposeReset" title="Voltar ao tom original" style="display:none;margin-left:auto;font-size:.72rem;">↺ orig.</button>
    </div>
  </div>
</div>

<!-- Setlist Panel -->
<div id="setlistPanel" class="overlay" aria-hidden="true">
  <div class="overlay-header">
    <button class="overlay-back" id="setlistClose">‹ Fechar</button>
    <span class="overlay-title">🎼 Meu Repertório</span>
  </div>
  <div class="overlay-body" id="setlistBody"></div>
  <div class="setlist-footer" id="setlistFooter">
    <button class="setlist-play-btn" id="setlistPlayBtn" style="display:none">▶ Tocar do início</button>
    <div class="setlist-io-row">
      <button class="setlist-io-btn" id="exportBtn">⬇ Exportar</button>
      <button class="setlist-io-btn" id="importBtn">⬆ Importar</button>
    </div>
    <input type="file" id="importInput" accept=".json,application/json" style="display:none">
  </div>
</div>

<script>
'use strict';

/* ── Constants ─────────────────────────────────────────────────────────── */
const REPO       = 'jeferprog/repertorio-cifras';
const BRANCH     = 'main';
const API        = `https://api.github.com/repos/${REPO}/contents`;
const RAW        = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
const TREE_API   = `https://api.github.com/repos/${REPO}/git/trees/${BRANCH}?recursive=1`;
const RECENT_KEY = 'cifras_v3_recent';
const SETLIST_KEY = 'cifras_setlist_v1';
const THEME_KEY  = 'cifras_theme';
const MAX_RECENT = 6;
const PDFJS      = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174';

const CAT_META = {
  'Sertanejo Modão':              { icon: '🤠', desc: 'Duplas tradicionais' },
  'Sertanejo raiz':               { icon: '🌵', desc: 'Caipira e viola' },
  'Sertanejo Universitário':      { icon: '🎵', desc: 'Sertanejo pop' },
  'Sertanejo Universitário 2026': { icon: '✨', desc: 'Lançamentos 2026' },
  'Sertanejo':                    { icon: '🎸', desc: 'Compilado geral' },
};

/* ── Theme ──────────────────────────────────────────────────────────────── */
(function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  updateThemeBtn();
})();

function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
  updateThemeBtn();
}

function updateThemeBtn() {
  const btn = document.getElementById('themeBtn');
  if (!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark'
    || (!document.documentElement.getAttribute('data-theme')
        && window.matchMedia('(prefers-color-scheme: dark)').matches);
  btn.textContent = isDark ? '☀️' : '🌙';
  btn.setAttribute('aria-label', isDark ? 'Modo claro' : 'Modo escuro');
}

document.getElementById('themeBtn').addEventListener('click', toggleTheme);

/* ── Recent ──────────────────────────────────────────────────────────────── */
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch { return []; }
}
function addRecent(entry) {
  let list = getRecent().filter(s => s.url !== entry.url);
  list.unshift(entry);
  if (list.length > MAX_RECENT) list = list.slice(0, MAX_RECENT);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch {}
}

/* ── Setlist ─────────────────────────────────────────────────────────────── */
function getSetlist() {
  try { return JSON.parse(localStorage.getItem(SETLIST_KEY) || '[]'); } catch { return []; }
}
function saveSetlist(list) {
  try { localStorage.setItem(SETLIST_KEY, JSON.stringify(list)); } catch {}
  updateSetlistBadge();
}
function isInSetlist(url) { return getSetlist().some(s => s.url === url); }

function toggleSetlist(entry) {
  let list = getSetlist();
  const idx = list.findIndex(s => s.url === entry.url);
  if (idx >= 0) list.splice(idx, 1); else list.push(entry);
  saveSetlist(list);
  refreshAddBtns();
}

function refreshAddBtns() {
  document.querySelectorAll('[data-add-song]').forEach(btn => {
    try {
      const entry = JSON.parse(btn.dataset.addSong);
      const inList = isInSetlist(entry.url);
      btn.classList.toggle('in-list', inList);
      btn.textContent = inList ? '✓' : '+';
    } catch {}
  });
}

function updateSetlistBadge() {
  const n = getSetlist().length;
  const b = document.getElementById('setlistBadge');
  if (!b) return;
  b.textContent = n || '';
  b.classList.toggle('show', n > 0);
}

/* ── Setlist Panel ───────────────────────────────────────────────────────── */
function openSetlistPanel() {
  renderSetlistPanel();
  const p = document.getElementById('setlistPanel');
  p.setAttribute('aria-hidden', 'false');
  p.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeSetlistPanel() {
  const p = document.getElementById('setlistPanel');
  p.classList.remove('open');
  p.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}

function renderSetlistPanel() {
  const body   = document.getElementById('setlistBody');
  const footer = document.getElementById('setlistFooter');

document.getElementById('setlistBody').addEventListener('click', e => {
  const up   = e.target.closest('[data-sl-up]');
  const down = e.target.closest('[data-sl-down]');
  const rm   = e.target.closest('[data-sl-rm]');
  const play = e.target.closest('[data-sl-play]');

  if (up) {
    const i = +up.dataset.slUp, list = getSetlist();
    if (i > 0) { [list[i-1],list[i]]=[list[i],list[i-1]]; saveSetlist(list); renderSetlistPanel(); }
  } else if (down) {
    const i = +down.dataset.slDown, list = getSetlist();
    if (i < list.length-1) { [list[i],list[i+1]]=[list[i+1],list[i]]; saveSetlist(list); renderSetlistPanel(); }
  } else if (rm) {
    const list = getSetlist();
    list.splice(+rm.dataset.slRm, 1);
    saveSetlist(list); renderSetlistPanel(); refreshAddBtns();
  } else if (play) {
    const i = +play.dataset.slPlay, list = getSetlist();
    if (list[i]) { closeSetlistPanel(); openViewer(list[i], list, i); }
  }
});

document.getElementById('setlistPlayBtn').addEventListener('click', () => {
  const list = getSetlist();
  if (list.length) { closeSetlistPanel(); openViewer(list[0], list, 0); }
});

document.getElementById('setlistClose').addEventListener('click', closeSetlistPanel);
document.getElementById('setlistBtn').addEventListener('click', openSetlistPanel);

/* ── Export / Import ────────────────────────────────────────────────────── */
document.getElementById('exportBtn').addEventListener('click', () => {
  const list = getSetlist();
  if (!list.length) { alert('O repertório está vazio. Adicione músicas antes de exportar.'); return; }
  const json = JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), setlist: list }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `repertorio-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importInput').value = '';
  document.getElementById('importInput').click();
});

document.getElementById('importInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data  = JSON.parse(ev.target.result);
      const items = Array.isArray(data) ? data : (data.setlist || []);
      const valid = items.filter(s => s.title && s.url);
      if (!valid.length) { alert('Arquivo inválido ou repertório vazio.'); return; }
      const current = getSetlist();
      if (current.length) {
        const merge = confirm(`Você já tem ${current.length} música(s) no repertório.\n\nCancelar = substituir tudo\nOK = adicionar ao repertório atual`);
        if (merge) {
          // merge: add only entries not already present
          const urls = new Set(current.map(s => s.url));
          const news = valid.filter(s => !urls.has(s.url));
          saveSetlist([...current, ...news]);
          alert(`${news.length} música(s) adicionada(s) ao repertório.`);
        } else {
          saveSetlist(valid);
          alert(`${valid.length} música(s) importada(s). Repertório anterior substituído.`);
        }
      } else {
        saveSetlist(valid);
        alert(`${valid.length} música(s) importada(s) com sucesso!`);
      }
      renderSetlistPanel();
      refreshAddBtns();
    } catch { alert('Erro ao ler o arquivo. Verifique se é um arquivo de repertório válido.'); }
  };
  reader.readAsText(file);
});

/* ── State ───────────────────────────────────────────────────────────────── */
let stack    = [];
let memCache = {};
let catalog  = null;

let viewerPlaylist = [];
let viewerIdx      = -1;
let globalMatches  = [];

/* ── Helpers ─────────────────────────────────────────────────────────────── */
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function encPath(parts) { return parts.map(p => encodeURIComponent(p)).join('/'); }
function songTitle(fn) {
  return fn.replace(/\.pdf$/i,'').replace(/[_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim();
}
function artistDisplay(n) { return n.replace(/\s*\(\d+\)\s*$/,'').trim(); }
function songCount(n) { const m=n.match(/\((\d+)\)$/); return m?`${m[1]} música${+m[1]!==1?'s':''}`:''; }

function songItemHtml(entry, meta, playlistIdx) {
  const inList = isInSetlist(entry.url);
  const idxAttr = playlistIdx !== undefined ? `data-playlist-idx="${playlistIdx}"` : '';
  return `<div class="list-item song-item" data-open-song='${esc(JSON.stringify(entry))}' ${idxAttr}>
    <span class="item-icon">♪</span>
    <div class="item-body">
      <div class="item-name">${esc(entry.title)}</div>
      ${meta ? `<div class="item-meta">${esc(meta)}</div>` : ''}
    </div>
    <button class="add-btn ${inList?'in-list':''}" data-add-song='${esc(JSON.stringify(entry))}'
            aria-label="${inList?'Remover do repertório':'Adicionar ao repertório'}">${inList?'✓':'+'}</button>
  </div>`;
}

/* ── GitHub API ──────────────────────────────────────────────────────────── */
async function fetchDir(parts=[]) {
  const key = parts.join('\0');
  if (memCache[key]) return memCache[key];
  const url = parts.length ? `${API}/${encPath(parts)}` : API;
  const res = await fetch(url, {headers:{Accept:'application/vnd.github.v3+json'}});
  if (!res.ok) {
    if (res.headers.get('x-ratelimit-remaining')==='0') throw Object.assign(new Error,{code:'rate_limit'});
    throw new Error(`HTTP ${res.status}`);
  }
  const data = await res.json();
  memCache[key] = data;
  return data;
}

async function loadCatalog() {
  if (catalog) return catalog;
  const res = await fetch(TREE_API, {headers:{Accept:'application/vnd.github.v3+json'}});
  if (!res.ok) {
    if (res.headers.get('x-ratelimit-remaining')==='0') throw Object.assign(new Error,{code:'rate_limit'});
    throw new Error(`HTTP ${res.status}`);
  }
  const data = await res.json();
  catalog = (data.tree||[]).filter(i=>i.type==='blob'&&/\.pdf$/i.test(i.path)).map(i=>{
    const parts    = i.path.split('/');
    const category = parts[0]||'';
    const artist   = parts.length>2 ? artistDisplay(parts[1]) : category;
    const title    = songTitle(parts[parts.length-1]);
    const url      = `${RAW}/${parts.map(p=>encodeURIComponent(p)).join('/')}`;
    return {category,artist,title,url};
  });
  return catalog;
}

/* ── Header ──────────────────────────────────────────────────────────────── */

  const backBtn = document.getElementById('backBtn');

    backBtn.classList.remove('show');

    backBtn.classList.add('show');

    backBtn.classList.add('show');
    title.textContent=artistDisplay(stack[stack.length-1]); sub.textContent=stack[0];
  }
}

/* ── Directory view ──────────────────────────────────────────────────────── */
async function renderDir() {
  updateHeader(); setLoading();
  try {
    const items = await fetchDir(stack);
    const dirs  = items.filter(i=>i.type==='dir');
    const files = items.filter(i=>i.type==='file'&&/\.pdf$/i.test(i.name));

    else if (files.length>0) renderSongs(files);

  } catch(e) { setError(e); }
}

function renderArtists(dirs) {

    <div class="search-wrap">

      <input class="search-input" id="searchInput" type="search"

        <div class="list-item song-item" data-open-song='${esc(JSON.stringify(e))}' data-playlist-idx="${i}" data-q="${esc(e.title.toLowerCase())}">
          <span class="item-icon">♪</span>

          <button class="add-btn ${isInSetlist(e.url)?'in-list':''}" data-add-song='${esc(JSON.stringify(e))}' aria-label="Adicionar ao repertório">${isInSetlist(e.url)?'✓':'+'}</button>

/* ── PDF.js ──────────────────────────────────────────────────────────────── */
let pdfJsReady = false;
function loadPdfJs() {
  if (pdfJsReady) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=`${PDFJS}/pdf.min.js`;
    s.onload=()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc=`${PDFJS}/pdf.worker.min.js`; pdfJsReady=true; res(); };
    s.onerror=rej; document.head.appendChild(s);
  });
}

/* ── Auto-scroll ─────────────────────────────────────────────────────────── */
const SPEEDS=[0.12,0.25,0.45,0.75,1.1,1.8,3.0];
let speedIdx=2, rafId=null;

function updateSpeedLabel() {
  const el=document.getElementById('speedLabel');
  if(el) el.textContent=`Velocidade ${speedIdx+1} / ${SPEEDS.length}`;
}
function stopScroll() {
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  const btn=document.getElementById('scrollToggle');
  if(btn) btn.textContent='▶ Rolar';
}
function startScroll() {
  const body=document.getElementById('viewerBody');
  const btn=document.getElementById('scrollToggle');
  btn.textContent='⏸ Pausar';
  let accum=0;
  function step() {
    accum+=SPEEDS[speedIdx];
    const px=Math.floor(accum);
    if(px>=1){body.scrollTop+=px;accum-=px;}
    const atEnd=body.scrollTop>=body.scrollHeight-body.clientHeight-1;
    if(!atEnd){rafId=requestAnimationFrame(step);}else{rafId=null;btn.textContent='▶ Rolar';}
  }
  rafId=requestAnimationFrame(step);
}
function toggleScroll(){if(rafId)stopScroll();else startScroll();}

document.getElementById('scrollToggle').addEventListener('click', toggleScroll);
document.getElementById('speedDown').addEventListener('click', ()=>{ speedIdx=Math.max(0,speedIdx-1); updateSpeedLabel(); });
document.getElementById('speedUp').addEventListener('click',   ()=>{ speedIdx=Math.min(SPEEDS.length-1,speedIdx+1); updateSpeedLabel(); });

/* ── Viewer nav buttons ──────────────────────────────────────────────────── */
function updateNavButtons() {
  const prev=document.getElementById('prevBtn');
  const next=document.getElementById('nextBtn');
  const info=document.getElementById('navInfo');
  if(!prev) return;
  prev.disabled = viewerIdx<=0;
  next.disabled = viewerIdx>=viewerPlaylist.length-1;
  info.textContent = viewerPlaylist.length>1 ? `${viewerIdx+1} / ${viewerPlaylist.length}` : '';
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(viewerIdx>0){ viewerIdx--; loadContent(viewerPlaylist[viewerIdx]); updateNavButtons(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(viewerIdx<viewerPlaylist.length-1){ viewerIdx++; loadContent(viewerPlaylist[viewerIdx]); updateNavButtons(); }
});

/* ── Viewer open/close ───────────────────────────────────────────────────── */
function openViewer(entry, playlist, idx) {
  viewerPlaylist = playlist || [entry];
  viewerIdx      = idx !== undefined ? idx : 0;
  stopScroll();
  const overlay = document.getElementById('viewer');
  overlay.setAttribute('aria-hidden','false');
  overlay.classList.add('open');
  document.body.style.overflow='hidden';
  loadContent(entry);
}

async function loadContent(entry) {
  addRecent(entry);
  // Reset transpose state for new song
  transposeState  = 0;
  currentPdfDoc   = null;
  cachedCanvases  = [];
  extractedPages  = null;
  updateTransposeLabel();

  const body    = document.getElementById('viewerBody');
  const loading = document.getElementById('viewerLoading');
  const canvas  = document.getElementById('viewerCanvas');
  const controls= document.getElementById('viewerControls');

  document.getElementById('viewerTitle').textContent = entry.title;
  loading.style.display='';
  loading.innerHTML=`<div class="spinner"></div>Carregando cifra…<span class="viewer-loading-sub" id="viewerLoadingPages"></span>`;
  canvas.innerHTML='';
  controls.style.display='none';
  body.scrollTop=0;
  stopScroll();

  try {
    await loadPdfJs();
    const pgLabel = document.getElementById('viewerLoadingPages');
    const pdf     = await pdfjsLib.getDocument(entry.url).promise;
    currentPdfDoc = pdf;
    const dpr     = window.devicePixelRatio||1;
    const width   = body.clientWidth-16;
    for(let i=1;i<=pdf.numPages;i++){
      if(pgLabel) pgLabel.textContent=`Página ${i} de ${pdf.numPages}…`;
      const page=await pdf.getPage(i);
      const base=page.getViewport({scale:1});
      const vp=page.getViewport({scale:(width/base.width)*dpr});
      const c=document.createElement('canvas');
      c.width=vp.width; c.height=vp.height;
      c.style.width=`${width}px`; c.style.height=`${Math.round(vp.height/dpr)}px`;
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      canvas.appendChild(c);
    }
    cachedCanvases = [...canvas.querySelectorAll('canvas')];
    loading.style.display='none';
    controls.style.display='';
    updateSpeedLabel();
    updateNavButtons();
  } catch {
    loading.innerHTML='<div class="empty-icon">⚠️</div><div>Erro ao carregar o PDF.<br>Verifique sua conexão.</div>';
  }
}

function closeViewer() {
  stopScroll();
  const overlay=document.getElementById('viewer');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  viewerPlaylist=[]; viewerIdx=-1;
  setTimeout(()=>{
    document.getElementById('viewerCanvas').innerHTML='';
    document.getElementById('viewerControls').style.display='none';
    document.getElementById('viewerLoading').style.display='';
    document.getElementById('viewerLoading').innerHTML=`<div class="spinner"></div>Carregando cifra…<span class="viewer-loading-sub" id="viewerLoadingPages"></span>`;
  },320);
}

document.getElementById('viewerBack').addEventListener('click', closeViewer);
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  const viewerOpen = document.getElementById('viewer').classList.contains('open');
  if(e.key==='Escape'){
    if(viewerOpen) closeViewer(); else closeSetlistPanel();
    return;
  }
  if(!viewerOpen) return;
  if(e.key===' '){
    e.preventDefault();
    toggleScroll();
  } else if(e.key==='ArrowDown'){
    e.preventDefault();
    document.getElementById('viewerBody').scrollTop += 160;
  } else if(e.key==='ArrowUp'){
    e.preventDefault();
    document.getElementById('viewerBody').scrollTop -= 160;
  }
});

/* ── Event delegation ────────────────────────────────────────────────────── */
document.addEventListener('click', e=>{
  // Add-to-setlist button (must come first to prevent song open)
  const addBtn = e.target.closest('[data-add-song]');
  if(addBtn){
    try{toggleSetlist(JSON.parse(addBtn.dataset.addSong));}catch{}
    return;
  }

  const navEl  = e.target.closest('[data-nav]');
  const songEl = e.target.closest('[data-open-song]');

  if(navEl){ navigate(navEl.dataset.nav); return; }

  if(songEl){
    try{
      const entry = JSON.parse(songEl.dataset.openSong);
      const sl    = document.getElementById('songsList');
      const gl    = document.getElementById('globalList');

      if(sl && sl._playlist && songEl.closest('#songsList')){
        const idx = +(songEl.dataset.playlistIdx||0);
        openViewer(entry, sl._playlist, idx);
      } else if(gl && globalMatches.length && songEl.closest('#globalList')){
        const idx = +(songEl.dataset.playlistIdx||0);
        openViewer(entry, globalMatches.slice(0,100), idx);
      } else {
        openViewer(entry, [entry], 0);
      }
    }catch{}
  }
});

/* ── Transposition engine ────────────────────────────────────────────────── */
const NOTES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTES_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_IDX    = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

function transposeNote(note, st) {
  const i = NOTE_IDX[note];
  if (i === undefined) return note;
  const ni = ((i + st) % 12 + 12) % 12;
  return (st < 0 ? NOTES_FLAT : NOTES_SHARP)[ni];
}

// Handles: Am, G#7, Bbmaj7, F#m, C/E, Dm7b5, etc.
const CHORD_TOKEN_RE = /^([A-G](?:#|b)?)((?:m(?:aj\d*)?|min|dim|aug|sus\d*|add\d*|\d+|°|ø)*)(?:\/([A-G](?:#|b)?))?$/;

function isChord(tok) { return CHORD_TOKEN_RE.test(tok); }

function transposeChord(chord, st) {
  if (st === 0) return chord;
  const m = chord.match(CHORD_TOKEN_RE);
  if (!m) return chord;
  const [, root, mods, bass] = m;
  return transposeNote(root, st) + mods + (bass ? '/' + transposeNote(bass, st) : '');
}

function isChordLine(line) {
  const toks = line.trim().split(/\s+/).filter(t => t);
  if (!toks.length) return false;
  const n = toks.filter(isChord).length;
  return n >= 1 && n / toks.length >= 0.45;
}

/* Extract text lines from a loaded pdfjsLib PDF document */
async function extractTextPages(pdf) {
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page    = await pdf.getPage(p);
    const content = await page.getTextContent();

    // Bucket items by Y position (5-unit tolerance)
    const byY = new Map();
    for (const item of content.items) {
      if (!item.str) continue;
      const y = Math.round(item.transform[5] / 5) * 5;
      if (!byY.has(y)) byY.set(y, []);
      byY.get(y).push({ x: item.transform[4], str: item.str, w: item.width || 0 });
    }

    // Sort top-to-bottom (PDF Y=0 at bottom → descending)
    const lines = [...byY.entries()]
      .sort((a, b) => b[0] - a[0])
      .map(([, items]) => {
        items.sort((a, b) => a.x - b.x);
        let line = '', lastX = null, lastW = 0;
        for (const it of items) {
          if (lastX !== null) {
            const gap = it.x - (lastX + lastW);
            line += ' '.repeat(Math.max(1, Math.round(gap / 6)));
          }
          line += it.str;
          lastX = it.x; lastW = it.w;
        }
        return line;
      });

    pages.push(lines);
  }
  return pages;
}

/* Render extracted text as HTML with highlighted/transposed chords */
function renderTextView(pages, st) {
  const canvas = document.getElementById('viewerCanvas');
  const rows = [];
  pages.forEach((lines, pi) => {
    if (pi > 0) rows.push(`<div class="tv-row tv-page-sep">• • •</div>`);
    for (const line of lines) {
      if (!line.trim()) { rows.push(`<div class="tv-row empty"></div>`); continue; }
      if (isChordLine(line)) {
        const html = line.replace(/\S+/g, tok =>
          isChord(tok) ? `<span class="tv-chord">${esc(transposeChord(tok,st))}</span>` : esc(tok));
        rows.push(`<div class="tv-row chord">${html}</div>`);
      } else {
        rows.push(`<div class="tv-row lyric">${esc(line)}</div>`);
      }
    }
  });
  canvas.innerHTML = `<div class="text-view-wrap">${rows.join('')}</div>`;
}

/* Transpose state */
let transposeState = 0;
let currentPdfDoc  = null;   // cached pdfjsLib document
let cachedCanvases = [];     // cached canvas elements (PDF view)
let extractedPages = null;   // cached text lines

function updateTransposeLabel() {
  const lbl   = document.getElementById('transposeLabel');
  const reset = document.getElementById('transposeReset');
  if (!lbl) return;
  lbl.textContent = transposeState === 0 ? '0' : (transposeState > 0 ? `+${transposeState}` : `${transposeState}`);
  if (reset) reset.style.display = transposeState !== 0 ? '' : 'none';
}

async function applyTranspose(delta) {
  transposeState += delta;
  updateTransposeLabel();
  if (!currentPdfDoc) return;

  const canvas  = document.getElementById('viewerCanvas');
  const loading = document.getElementById('viewerLoading');

  if (transposeState === 0) {
    // Restore PDF canvas from cache
    canvas.innerHTML = '';
    cachedCanvases.forEach(c => canvas.appendChild(c));
    return;
  }

  // Extract text once
  if (!extractedPages) {
    loading.style.display = '';
    loading.innerHTML = `<div class="spinner"></div>Extraindo texto…`;
    canvas.innerHTML  = '';
    try {
      extractedPages = await extractTextPages(currentPdfDoc);
    } catch {
      loading.innerHTML = '<div class="empty-icon">⚠️</div><div>Erro ao extrair texto.</div>';
      return;
    }
    loading.style.display = 'none';
  }

  renderTextView(extractedPages, transposeState);
}

document.getElementById('transposeDown').addEventListener('click', () => applyTranspose(-1));
document.getElementById('transposeUp').addEventListener('click',   () => applyTranspose(+1));
document.getElementById('transposeReset').addEventListener('click', () => {
  transposeState = 0;
  updateTransposeLabel();
  const canvas = document.getElementById('viewerCanvas');
  canvas.innerHTML = '';
  cachedCanvases.forEach(c => canvas.appendChild(c));
});

/* ── Boot ────────────────────────────────────────────────────────────────── */
updateSetlistBadge();
renderRoot();
</script>
